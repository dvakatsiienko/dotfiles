# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true
command_timeout = 500

# Left: place -> langs -> git, then diff counts. Right: command duration.
format = """
[](color_orange)\
$os\
[](bg:color_yellow fg:color_orange)\
$directory\
${custom.sep_blue}\
${custom.cap_yellow}\
$nodejs\
$package\
$rust\
$golang\
$python\
${custom.sep_aqua_from_blue}\
${custom.sep_aqua_from_yellow}\
${custom.cap_blue}\
$git_branch\
$git_status\
$git_state\
$git_metrics\
${custom.gitcap}\
$line_break$character"""

right_format = """
$cmd_duration"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = '[$symbol]($style)'

[os.symbols]
Macos = "⚡️ "

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲰 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_state]
style = "bg:color_aqua"
format = '[[($state( $progress_current/$progress_total) )](bold fg:color_red bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

# Warp-parity diff counts, right after the pill — true red/green on plain bg
[git_metrics]
disabled = false
added_style = "bold fg:#b8bb26 bg:color_bg1"
deleted_style = "bold fg:#fb4934 bg:color_bg1"
format = '([](fg:color_aqua bg:color_bg1)([ +$added]($added_style))([ −$deleted]($deleted_style))[ ](bg:color_bg1)[](fg:color_bg1))'

[package]
symbol = "󰏗 "
format = '[[ $symbol$version ](fg:#fabd2f bg:color_blue)](bg:color_blue)'

# the chevrons and caps only print when the block behind them has content — outside a repo or a
# project the prompt used to end in two empty coloured blocks with a square edge.
# "project" ≈ what the tool modules above detect: node, rust, go, python markers.
[custom.sep_blue]
when = 'test -f package.json -o -f .nvmrc -o -f .node-version -o -f Cargo.toml -o -f go.mod -o -f pyproject.toml -o -f requirements.txt -o -f .python-version'
command = "true"
format = '[](fg:color_yellow bg:color_blue)'

[custom.cap_yellow]
when = '! ( test -f package.json -o -f .nvmrc -o -f .node-version -o -f Cargo.toml -o -f go.mod -o -f pyproject.toml -o -f requirements.txt -o -f .python-version ) && ! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = "true"
format = '[](fg:color_yellow)'

[custom.sep_aqua_from_blue]
when = 'test -f package.json -o -f .nvmrc -o -f .node-version -o -f Cargo.toml -o -f go.mod -o -f pyproject.toml -o -f requirements.txt -o -f .python-version && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = "true"
format = '[](fg:color_blue bg:color_aqua)'

[custom.sep_aqua_from_yellow]
when = '! ( test -f package.json -o -f .nvmrc -o -f .node-version -o -f Cargo.toml -o -f go.mod -o -f pyproject.toml -o -f requirements.txt -o -f .python-version ) && git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = "true"
format = '[](fg:color_yellow bg:color_aqua)'

[custom.cap_blue]
when = 'test -f package.json -o -f .nvmrc -o -f .node-version -o -f Cargo.toml -o -f go.mod -o -f pyproject.toml -o -f requirements.txt -o -f .python-version && ! git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = "true"
format = '[](fg:color_blue)'

[custom.gitcap]
when = 'git rev-parse --git-dir >/dev/null 2>&1 && [ -z "$(git diff HEAD --numstat 2>/dev/null | head -1)" ]'
command = "true"
format = '[](fg:color_aqua)'

[nodejs]
symbol = ""
format = '[[ $symbol](fg:color_fg0 bg:color_blue)[( $version) ](fg:color_fg0 bg:color_blue)](bg:color_blue)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

# Shows only when the last command ran 2s+
[cmd_duration]
min_time = 2000
format = '[ 󰥔 $duration](fg:color_bg3)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[λ](bold green fg:color_green)'
error_symbol = '[λ](bold fg:color_red)'
vimcmd_symbol = '[λ](bold fg:color_green)'
vimcmd_replace_one_symbol = '[λ](bold fg:color_purple)'
vimcmd_replace_symbol = '[λ](bold fg:color_purple)'
vimcmd_visual_symbol = '[λ](bold fg:color_yellow)'
