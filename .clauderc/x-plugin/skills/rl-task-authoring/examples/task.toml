[task]
name = "acme/vite-wintertc-middleware"
description = "Extend Vite's server.middlewareMode with a \"winter-tc\" value that exposes server.fetch(request), running the Connect middleware stack against a standard Request and returning a standard Response so WinterTC-style runtimes integrate without writing their own Node adapter. Request and response bodies must stream as well as buffer, and headers must survive the conversion in both directions."
